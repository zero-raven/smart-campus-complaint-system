{% extends "base.html" %}
{% block title %}Complaints · {{ app_name }}{% endblock %}

{% block content %}
<div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-4">
  <div>
    <h1 class="page-title">Complaints</h1>
    <p class="text-secondary small mb-0 mt-1" id="list-subtitle">Loading&hellip;</p>
  </div>
  <a class="btn btn-primary" href="/complaints/new">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="me-2"><path d="M12 5v14M5 12h14"/></svg>
    New complaint
  </a>
</div>

<div class="card mb-4">
  <div class="card-body py-3">
    <div class="d-flex flex-column flex-md-row gap-3 align-items-stretch align-items-md-center">
      <div class="flex-grow-1 position-relative">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="position-absolute" style="left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted);">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input class="form-control ps-5" id="search" placeholder="Search subject or description&hellip;" autocomplete="off">
      </div>
      <select class="form-select" id="filter-status" style="max-width: 200px;">
        <option value="">All statuses</option>
      </select>
    </div>
  </div>
</div>

<div id="complaints-container">
  <div class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading&hellip;</span>
    </div>
    <p class="text-secondary small mt-3">Loading complaints&hellip;</p>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/app.js"></script>
<style>
.complaint-card {
  background: var(--surface-1);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  margin-bottom: var(--space-3);
  transition: border-color var(--duration-normal) var(--ease), box-shadow var(--duration-normal) var(--ease), transform var(--duration-normal) var(--ease);
  cursor: pointer;
}
.complaint-card:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}
.complaint-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: var(--space-3);
  margin-bottom: var(--space-3);
}
.complaint-ticket {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--text-muted);
  letter-spacing: 0.05em;
}
.complaint-subject {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1.125rem;
  color: var(--text-primary);
  margin: 0;
  line-height: 1.4;
}
.complaint-meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  align-items: center;
  margin-top: var(--space-3);
}
.complaint-meta-item {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-size: 0.8125rem;
  color: var(--text-secondary);
}
.complaint-actions {
  display: flex;
  gap: var(--space-2);
  flex-shrink: 0;
}
@media (max-width: 768px) {
  .complaint-card-header {
    flex-direction: column;
  }
  .complaint-actions {
    width: 100%;
    justify-content: flex-end;
  }
}
</style>
{% endblock %}
