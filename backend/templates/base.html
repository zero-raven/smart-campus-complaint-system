<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#212529">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>

{% block navbar %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
  <div class="container">
    <a class="navbar-brand" href="/">
      <span class="d-none d-sm-inline">Smart Campus</span><span class="d-sm-none">SCMS</span>
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#mainNav" aria-controls="mainNav"
            aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link{% if active_page == 'complaints' %} active{% endif %}" href="/complaints">Complaints</a></li>
        <li class="nav-item"><a class="nav-link{% if active_page == 'new_complaint' %} active{% endif %}" href="/complaints/new">New</a></li>
        <li class="nav-item"><a class="nav-link{% if active_page == 'dashboard' %} active{% endif %}" href="/dashboard">Dashboard</a></li>
        <li class="nav-item"><a class="nav-link{% if active_page == 'admin_rules' %} active{% endif %}" href="/admin/rules">Rules</a></li>
        <li class="nav-item"><a class="nav-link{% if active_page == 'admin_models' %} active{% endif %}" href="/admin/models">Models</a></li>
      </ul>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/login" id="login-link">Login</a></li>
        <li class="nav-item"><a class="nav-link" href="/register">Register</a></li>
      </ul>
    </div>
  </div>
</nav>
{% endblock %}

<main class="container py-3 py-md-4">
  {% block content %}{% endblock %}
</main>

<footer class="container py-4 text-muted border-top mt-auto">
  <small class="d-block text-center text-md-start">
    DBMS CD252IA &middot; 1RV24CS176 &middot; 1RV24CS174
  </small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
