{% extends "base.html" %}
{% block title %}Register · {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-8 col-lg-6">
    <div class="card card-auth">
      <div class="card-body p-4">
        <h1 class="h5 mb-1 card-title">Student registration</h1>
        <p class="text-secondary small mb-3">
          Staff and administrator accounts are created by an administrator.
        </p>
        <form id="register-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="full_name">Full name</label>
            <input class="form-control" id="full_name" name="full_name" required minlength="2">
          </div>
          <div class="row g-3">
            <div class="col-12 col-sm-6">
              <label class="form-label" for="reg-username">Username</label>
              <input class="form-control" id="reg-username" name="username" required
                     minlength="3" pattern="[a-zA-Z0-9._\-]+" autocapitalize="none" spellcheck="false">
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" id="email" name="email" type="email" required>
            </div>
          </div>
          <div class="row g-3 mt-0">
            <div class="col-12 col-sm-6">
              <label class="form-label" for="usn">USN <span class="text-muted">(optional)</span></label>
              <input class="form-control" id="usn" name="usn">
            </div>
            <div class="col-12 col-sm-6">
              <label class="form-label" for="reg-password">Password</label>
              <input class="form-control" id="reg-password" name="password" type="password"
                     required minlength="8" autocomplete="new-password">
            </div>
          </div>
          <button class="btn btn-primary w-100 mt-3" type="submit">Create account</button>
        </form>
        <div id="register-msg" class="mt-3"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/app.js"></script>{% endblock %}
