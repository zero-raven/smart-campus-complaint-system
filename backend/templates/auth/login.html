{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <div class="card">
      <div class="card-body p-4">
        <h1 class="h5 mb-3">Sign in</h1>
        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="username">Username or email</label>
            <input class="form-control" id="username" name="username" required
                   autocomplete="username" autocapitalize="none" spellcheck="false">
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password"
                   required autocomplete="current-password">
          </div>
          <button class="btn btn-primary w-100" type="submit">Sign in</button>
        </form>
        <div id="login-msg" class="mt-3"></div>
        <p class="small text-muted mt-3 mb-0 text-center">
          No account? <a href="/register">Register as a student</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/app.js"></script>{% endblock %}
